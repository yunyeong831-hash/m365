<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m365 홈 리뉴얼 — 목업</title>
<meta name="description" content="한국모빌리티전자계약 m365 앱 홈 리뉴얼 프로토타입 목업">
<link rel="icon" href="assets/mobility365.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   m365 Design System — color tokens
   Source: _ds/m365-front/tokens/colors.css
   ───────────────────────────────────────────────────────────── */
:root {
  /* Brand */
  --m-orange: #ff6f0f;
  --m-orange-hover: #f05f00;
  --m-orange-50: #fff4ec;
  --m-orange-100: #ffe3cf;
  --m-orange-banner: #ffe7b8;

  /* Secondary action (blue) */
  --m-blue: #005cb9;
  --m-blue-hover: #004f9e;
  --m-blue-50: #f4f8fe;

  /* Accent */
  --m-green: #5aa29c;

  /* Semantic status */
  --m-red: #ef4344;
  --m-red-strong: #ff0000;

  /* Ink (text) */
  --m-ink-900: #2e2e2e;
  --m-ink-800: #323232;
  --m-ink-700: #555b63;
  --m-ink-600: #666666;
  --m-ink-500: #6a7276;
  --m-ink-400: #808080;
  --m-ink-300: #b2b2b2;

  /* Lines */
  --m-line-200: #e5e5e5;
  --m-line-300: #dadada;
  --m-line-400: #d2d2d2;

  /* Surfaces */
  --m-bg: #ffffff;
  --m-surface-gray: #f6f8fa;
  --m-surface-gray-2: #eceff1;
  --m-overlay: rgba(0,0,0,0.55);

  /* Typography — Noto Sans KR (web) stands in for Noto Sans CJK KR (OTF) */
  --font-sans: "Noto Sans KR", "Noto Sans CJK KR", -apple-system,
    BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}

* { -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--m-surface-gray-2);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--m-blue); text-decoration: none; }
a:hover { color: var(--m-blue-hover); }

@keyframes m-sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes m-fade-in  { from { opacity: 0; }               to { opacity: 1; } }

/* ── Stage / device frame ────────────────────────────────── */
.stage {
  min-height: 100%;
  display: flex;
  justify-content: center;
  background: var(--m-surface-gray-2);
  font-family: var(--font-sans);
}
.phone {
  width: 390px;
  background: var(--m-surface-gray);
  box-shadow: 0 8px 40px rgba(0,0,0,.14);
  position: relative;
  overflow: hidden;
}
.statusbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px 6px;
  background: #ffffff;
  font-size: 13px; font-weight: 500; color: var(--m-ink-900);
}

/* ── Interaction states (ported from style-hover / style-active
      / style-focus attributes in the design file) ─────────── */
.h-gray:hover      { background: var(--m-surface-gray); }
.h-orange50:hover  { background: var(--m-orange-50); }
.h-noti:hover      { background: #ffece0; }
.h-white:hover     { background: #fff; }
.h-x:hover         { background: var(--m-orange-100); }

.h-btn:hover       { background: var(--m-orange-hover); }
.h-primary:hover   { background: var(--m-orange-hover); transform: translateY(-1px); }
.h-primary:active  { transform: scale(.99); }

.h-hero:hover  { background: var(--m-orange-hover); box-shadow: 0 8px 22px rgba(255,111,15,.36); transform: translateY(-2px); }
.h-hero:active { transform: scale(.985) translateY(0); box-shadow: 0 3px 10px rgba(255,111,15,.28); }

.h-tile:hover  { border-color: var(--m-orange); background: var(--m-orange-50); box-shadow: 0 6px 16px rgba(255,111,15,.14); transform: translateY(-1px); }
.h-quick:hover { transform: translateY(-3px); background: #fafbfc; }
.h-chip:hover  { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(0,0,0,.12); }

.h-bd:hover    { border-color: var(--m-orange); }
.h-out:hover   { border-color: var(--m-orange); color: var(--m-orange); }

.h-lift:hover  { box-shadow: 0 4px 16px rgba(0,0,0,.10); transform: translateY(-2px); }
.h-lift1:hover { box-shadow: 0 4px 14px rgba(0,0,0,.10); transform: translateY(-1px); }

.h-tx:hover    { color: var(--m-orange); }
.h-tx9:hover   { color: var(--m-ink-900); }
.h-txr:hover   { color: var(--m-red); }

.inp:focus     { border-color: var(--m-orange); }

/* ── Mockup chrome (not part of the app UI) ─────────────── */
.mock-bar {
  position: fixed; left: 0; right: 0; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px;
  background: rgba(46,46,46,.92);
  color: #fff;
  font-size: 12px; letter-spacing: -0.02em;
  backdrop-filter: blur(6px);
}
.mock-bar strong { font-weight: 700; }
.mock-bar .sp { flex: 1; }
.mock-bar select {
  font-family: inherit; font-size: 12px;
  height: 26px; padding: 0 8px;
  border-radius: 6px; border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.10); color: #fff;
  outline: none; cursor: pointer;
}
.mock-bar select option { color: #2e2e2e; }
.mock-bar .hint { color: rgba(255,255,255,.6); }
.stage { padding-top: 42px; }

@media (max-width: 430px) {
  .phone { width: 100%; box-shadow: none; }
  .mock-bar .hint { display: none; }
}
</style>
</head>
<body>

<div class="mock-bar">
  <strong>m365 홈 리뉴얼</strong>
  <span class="hint">클릭 가능한 프로토타입 목업</span>
  <span class="sp"></span>
  <select id="screenJump" aria-label="화면 이동">
    <option value="home">홈</option>
    <option value="noti">알림</option>
    <option value="more">더보기</option>
    <option value="buy">이용권 구매</option>
    <option value="pay">결제 내역</option>
    <option value="use">사용현황</option>
    <option value="rwd">리워드 내역</option>
    <option value="apply-finance">할부 신청</option>
    <option value="apply-insurance">보험 상담 신청</option>
    <option value="notice">공지사항</option>
    <option value="cs">고객센터</option>
  </select>
</div>

<div class="stage">
  <div class="phone" id="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span style="display: flex; align-items: center; gap: 6px; color: var(--m-ink-700); font-size: 12px;">LTE <span style="font-weight:700;">100%</span></span>
    </div>
    <div id="app"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
